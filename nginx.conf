# RiskPatch HTTPS Reverse Proxy
# Forwards HTTPS traffic to internal HTTP API
# Certificate: certs/cert.pem (self-signed, valid 1 year)

server {
    listen 8443 ssl http2;
    server_name localhost 127.0.0.1 *.local;

    # SSL Certificate & Key
    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Log
    access_log /var/log/nginx/riskpatch.log;
    error_log /var/log/nginx/riskpatch_error.log;

    # Reverse proxy to API
    location / {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Timeouts for long-running requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint (non-SSL redirect)
    location /health {
        proxy_pass http://api:8080/api/v1/ready;
    }
}
