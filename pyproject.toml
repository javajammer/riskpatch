[project]
name = "riskpatch"
version = "0.1.0"
description = "CVE watch for a manually declared tech stack"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.162.0",
  "httpx>=0.27",
  "packaging>=24",
  "pydantic>=2",
  "python-multipart>=0.0.9",
  "pyyaml>=6",
  "textual>=1.0",
  "uvicorn[standard]>=0.54.0",
]

[project.scripts]
riskpatch = "riskpatch.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/riskpatch"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
