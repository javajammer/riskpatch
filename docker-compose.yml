x-riskpatch: &riskpatch
  build: .
  image: riskpatch:0.2.0
  env_file:
    - path: .env
      required: false
  environment: &env
    RISKPATCH_DB: /data/db/stackwatch.sqlite3
    RISKPATCH_INVENTORY: /data/inventory/stack.yaml
    RISKPATCH_REPORTS: /data/reports
    RISKPATCH_CACHE: /data/cache
  user: "0:0"  # entrypoint chowns /data then drops to uid 1000
  volumes:
    - stackwatch-db:/data/db
    - stackwatch-backups:/data/backups
    - ./inventory:/data/inventory:ro
    - ./reports:/data/reports
    - ./cache:/data/cache
  restart: unless-stopped

services:
  api:
    <<: *riskpatch
    command: ["riskpatch", "api", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "0.0.0.0:8080:8080"  # accessible from any IP (DHCP-friendly)
    environment:
      <<: *env
      RISKPATCH_WORKERS: "4"  # one uvicorn process per core used; keep <= cpus
    mem_limit: 2g
    cpus: 4.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/v1/ready', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Exactly one worker: runs cve_sync hourly and analysis every 3 hours. Do not scale.
  worker:
    <<: *riskpatch
    command: ["riskpatch", "worker"]
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 1g
    cpus: 2.0

  # Legacy YAML inventory pipeline (kept as-is); enable with --profile legacy.
  watcher:
    <<: *riskpatch
    profiles: ["legacy"]
    command: ["riskpatch", "service"]
    healthcheck:
      test: ["CMD", "riskpatch", "validate"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 20s

  tui:
    <<: *riskpatch
    profiles: ["tui"]
    stdin_open: true
    tty: true
    restart: "no"
    command: ["riskpatch", "tui"]

  nginx:
    image: nginx:alpine
    ports:
      - "0.0.0.0:8443:8443"  # accessible from any IP (DHCP-friendly)
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  stackwatch-db:
  stackwatch-backups:
